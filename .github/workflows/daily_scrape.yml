name: Daily Running Races Scraper

on:
  schedule:
    # 06:00 UTC = 08:00 ώρα Ελλάδας (EET)
    - cron: '0 6 * * *'
  workflow_dispatch: # Επιτρέπει χειροκίνητη εκτέλεση οποιαδήποτε στιγμή

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run race scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_URL: ${{ secrets.GOOGLE_API_URL }}
          INGEST_API_SECRET: ${{ secrets.INGEST_API_SECRET }}
        run: python -u scraper.py
